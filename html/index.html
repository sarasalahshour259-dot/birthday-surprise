<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Surprise Birthday</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <main id="gate" class="gate">
    <div class="gate-card">
      <h1>ورود به سورپرایز🎂❤️🎉</h1>
      <p>رمز را وارد کنید:</p>
      <input type="password" id="passwordInput" placeholder="رمز..." />
      <button id="enterBtn">ورود</button>
      <p id="gateMsg" class="msg"></p>
    </div>
  </main>

  <div id="app" class="hidden">
    <section class="hero">
      <h1>تولد عمه کتی و عمو کاوه مبارکهه 🎂🌸
        این لحظه فقط برای خوشحال کردن شماست
       <h2>امیدوارم همیشه لبخند روی لبتون باشه 💖</h2>
      </h1>
      <p id="countdownText">10</p>
    </section>

    <section class="cake-section hidden" id="cakeSection">
      <div class="cake-wrapper">
        <div class="candle" id="candle">
          <div class="flame" id="flame"></div>
        </div>
        <div class="cake">
          <div class="cake-top"></div>
          <div class="cake-middle"></div>
          <div class="cake-bottom"></div>
        </div>
      </div>

      <button id="blowBtn">شمع را فوت کنید با هم دیگه 🎂</button>
    </section>

    <section class="message-section hidden">
      <h2>امیدوارم همیشه لبخند روی لبتون باشه 💖</h2>
      <p>این لحظه فقط برای خوشحال کردن شماست.</p>
    </section>

    <section class="photos-section hidden" id="photosSection">
      <h2>عکس‌های قشنگ</h2>

      <div class="gallery-title">عکس‌های تکی</div>
      <div class="photo-grid" id="singleGrid"></div>

      <div class="gallery-title">عکس‌های دونفره</div>
      <div class="photo-grid" id="togetherGrid"></div>

      <div class="gallery-title">عکس‌های خانوادگی</div>
      <div class="photo-grid" id="familyGrid"></div>
    </section>
  </div>

  <script src="../js/script.js"></script>
</body>
</html>
